<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Ravara · login code</title>
<style>
  body { font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f1216; color: #e6e8eb;
    display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; padding: 24px; box-sizing: border-box; }
  main { max-width: 560px; width: 100%; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  .code { font: 14px ui-monospace, Menlo, monospace; background: #171b21; border: 1px solid #262c34; border-radius: 8px;
    padding: 12px; word-break: break-all; margin: 12px 0; }
  button { font: inherit; background: #2563eb; color: #fff; border: 0; border-radius: 8px; padding: 10px 16px; cursor: pointer; }
  .muted { color: #8b939e; font-size: 14px; }
  .err { color: #f87171; }
</style>
</head>
<body>
<main>
  <h1 id="title">Ravara · login code</h1>
  <div id="body" class="muted">Reading…</div>
</main>
<script>
  // Shows the OAuth code from the address bar so it can be copied into the
  // Ravara login script on the owner's own computer. Nothing is sent anywhere:
  // no requests, no analytics, no external scripts.
  const q = new URLSearchParams(location.search);
  const body = document.getElementById('body');
  // Drop the code from the address bar and browser history once read.
  history.replaceState(null, '', location.pathname);
  if (q.get('error')) {
    document.getElementById('title').textContent = 'Login didn’t complete';
    body.innerHTML = '';
    const p = document.createElement('p');
    p.className = 'err';
    p.textContent = `${q.get('error')}: ${q.get('error_description') || ''}`;
    body.appendChild(p);
  } else if (q.get('code')) {
    const payload = JSON.stringify({ code: q.get('code'), state: q.get('state') });
    body.innerHTML = `<p>Copy this, then press Enter in the terminal where the login script is waiting.</p>
      <div class="code" id="code"></div><button id="copy">Copy login code</button>
      <p class="muted">The code expires within minutes and only works together with secrets held on your own computer.</p>`;
    document.getElementById('code').textContent = q.get('code');
    document.getElementById('copy').addEventListener('click', async e => {
      await navigator.clipboard.writeText(payload);
      e.target.textContent = 'Copied — now press Enter in the terminal';
    });
  } else {
    body.textContent = 'No login code here. Start the login from the Ravara login script.';
  }
</script>
</body>
</html>
